# Netlify static deploy (Vite SPA — no Node server required)
# Dashboard: set repo root, leave build/publish blank if this file is present.
# Optional cloud backup: Site settings → Environment variables → add VITE_SUPABASE_URL + VITE_SUPABASE_ANON_KEY

[build]
  command = "pnpm run build:netlify"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "22"

# Retired 2026-10-26: quoting now lives in the CRM (one price book that matches the website).
# Every old estimator link forwards to the CRM's quote-only screen.
[[redirects]]
  from = "/*"
  to = "https://sharkexteriorcalendar.netlify.app/quote-tool"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
